name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Run Jest & Supertest Tests
      run: npm test
      env:
        NODE_ENV: test
        MONGO_URI: ${{ secrets.MONGO_URI }}
        JWT_SECRET: "test-jwt-secret-for-ci"

    - name: AWS Deployment Simulation (Migration Notice)
      run: |
        echo "=================================================="
        echo "AWS EC2 Infrastructure successfully decommissioned."
        echo "Production backend is now automatically deployed on Render!"
        echo "=================================================="
